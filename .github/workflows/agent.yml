name: Adedamola's AI Agent

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 8 * * *'
    - cron: '0 17 * * *'
    - cron: '0 7 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  job-hunter:
    name: Daily Job Hunt
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '0 6'))
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Job Hunter
        run: python scripts/job_hunter.py

  crypto-monitor:
    name: Crypto Report
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (contains(github.event.schedule, '0 8') || contains(github.event.schedule, '0 17')))
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Crypto Monitor
        run: python scripts/crypto_agent.py

  ai-digest:
    name: AI News Digest
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '0 7'))
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run AI Digest
        run: python scripts/ai_digest.py

  writing-assistant:
    name: Writing Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check and respond to messages
        run: python scripts/writing_assistant.py
